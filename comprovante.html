<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enviar comprovante</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="pagina">


        <div class="card">


            <div class="icone">
                📄
            </div>


            <h1>
                Enviar comprovante
            </h1>


            <p>
                Obrigado por realizar sua doação!
                Envie agora o comprovante do Pix.
            </p>


            <form
                action="https://formsubmit.co/marllonbomfim0@gmail.com"
                method="POST"
                enctype="multipart/form-data"
            >


                <!-- ASSUNTO DO E-MAIL -->

                <input
                    type="hidden"
                    name="_subject"
                    value="Novo comprovante - Juntos por uma Criança"
                >


                <!-- FORMATO DO E-MAIL -->

                <input
                    type="hidden"
                    name="_template"
                    value="table"
                >


                <!-- NOME -->

                <label for="nome">
                    Seu nome
                </label>


                <input
                    type="text"
                    id="nome"
                    name="Nome"
                    placeholder="Digite seu nome"
                    required
                >


                <!-- VALOR -->

                <label for="valor">
                    Valor da doação
                </label>


                <input
                    type="text"
                    id="valor"
                    name="Valor da doação"
                    placeholder="Ex.: R$ 50,00"
                    required
                >


                <!-- COMPROVANTE -->

                <label>
                    Comprovante do Pix
                </label>


                <label
                    for="arquivo"
                    class="botao-arquivo"
                >
                    📎 Selecionar comprovante
                </label>


                <input
                    type="file"
                    id="arquivo"
                    name="attachment"
                    accept=".pdf,.jpg,.jpeg,.png"
                    required
                    hidden
                >


                <p
                    id="nomeArquivo"
                    class="nome-arquivo"
                >
                    Nenhum comprovante selecionado
                </p>


                <small>
                    Aceitamos PDF, JPG, JPEG e PNG.
                </small>


                <!-- BOTÃO ENVIAR -->

                <button
                    type="submit"
                    class="botao"
                >
                    📤 Enviar comprovante
                </button>


            </form>


            <!-- VOLTAR -->

            <a
                href="pix.html"
                class="voltar"
            >
                ← Voltar
            </a>


        </div>


    </main>


    <script>

        document
            .getElementById("arquivo")
            .addEventListener("change", function () {

                var arquivo = this.files[0];

                if (arquivo) {

                    document
                        .getElementById("nomeArquivo")
                        .textContent =
                        "✅ " + arquivo.name;

                }

            });

    </script>


</body>

</html>
