<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escolha sua doação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina">

        <div class="card">

            <div class="icone">🤝</div>

            <h1>Faça sua doação</h1>

            <p>
                Escolha um valor para ajudar ou digite
                quanto deseja doar.
            </p>

            <div class="valores">

                <button onclick="selecionarValor(10)">
                    R$ 10
                </button>

                <button onclick="selecionarValor(20)">
                    R$ 20
                </button>

                <button onclick="selecionarValor(50)">
                    R$ 50
                </button>

                <button onclick="selecionarValor(100)">
                    R$ 100
                </button>

            </div>

            <label for="valor">
                Outro valor
            </label>

            <input
                type="number"
                id="valor"
                placeholder="Digite o valor"
                min="1"
                step="0.01"
            >

            <button
                class="botao"
                onclick="irParaPix()"
            >
                Continuar
            </button>

            <a href="index.html" class="voltar">
                ← Voltar
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
